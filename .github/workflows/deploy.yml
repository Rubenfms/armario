name: Publicar PWA en GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Tests del motor de sugerencia (Vitest); sin ellos no se despliega.
      - run: npm test

      # `npm run build` ya hace el typecheck antes de vite build.
      - run: npm run build

      # Sin `enablement: true` a propósito: el GITHUB_TOKEN no puede crear el
      # sitio de Pages (hace falta permiso de administración del repo), así que
      # ponerlo convierte un paso manual en un error duro. Hay que activarlo una
      # vez a mano en Settings → Pages → Source: GitHub Actions.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
